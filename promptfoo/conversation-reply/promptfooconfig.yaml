# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: 'Conversation reply'

evaluateOptions:
  maxConcurrency: 1

prompts:
  - file://prompt.ts

providers:
  - id: groq:openai/gpt-oss-20b
    config:
      temperature: 0.5
      top_p: 1
      stop: null
      max_completion_tokens: 2048
      reasoning_effort: 'low'
      include_reasoning: true

tests:
  - description: 'es: first turn, practice for a trip'
    vars:
      nativeLanguage: en
      targetLanguage: es
      turns:
        - role: user
          content: Hi, I want to practice for my trip

  - description: 'en: user replies in Spanish while the target is English'
    vars:
      nativeLanguage: es
      targetLanguage: en
      turns:
        - role: user
          content: I like cooking on weekends
        - role: assistant
          content: What do you usually cook?
        - role: user
          content: Normalmente hago pasta o algo simple
