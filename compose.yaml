services:
  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
    environment:
      REDIS_ARGS: --requirepass mysecretpassword --appendonly
    volumes:
      - redis-data:/data
volumes:
  pgdata:
  redis-data:
    driver: local
